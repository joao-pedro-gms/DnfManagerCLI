[workspace]
resolver = "2"
members = ["crates/dnfm-core", "crates/dnfm-tui", "crates/dnfm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["João Pedro G. M. S."]
repository = "https://github.com/joao-pedro-gms/DnfManagerCLI"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
libc = "0.2"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = "6.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
